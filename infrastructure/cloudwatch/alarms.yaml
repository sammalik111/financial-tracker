AWSTemplateFormatVersion: "2010-09-09"
Description: "FinTrack CloudWatch Alarms"
Parameters:
  SNSTopicArn:
    Type: String
  LogGroupName:
    Type: String
    Default: /financial-tracker/app
Resources:
  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: fintrack-errors-high
      AlarmDescription: Application error rate exceeded threshold
      MetricName: error_count
      Namespace: FinTrack
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SNSTopicArn]
  ErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.level = "error" }'
      MetricTransformations:
        - MetricName: error_count
          MetricNamespace: FinTrack
          MetricValue: "1"
          DefaultValue: 0
